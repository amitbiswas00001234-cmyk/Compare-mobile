<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetPick Admin Panel | Control Center</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-admin: #0f172a;
      --card-admin: rgba(30, 41, 59, 0.7);
    }
    body { background: var(--bg-admin); color: #f8fafc; }
    .admin-container { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
    .admin-card { background: var(--card-admin); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .status-badge { padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; }
    .status-badge.green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-badge.yellow { background: rgba(234, 179, 8, 0.2); color: #fde047; }
    .log-container { background: #020617; border-radius: 8px; padding: 20px; font-family: monospace; font-size: 0.85rem; height: 300px; overflow-y: auto; color: #38bdf8; }
    .log-entry { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .sim-btn { width: 100%; padding: 12px; background: var(--bg-glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; cursor: pointer; transition: all 0.3s; text-align: left; margin-bottom: 10px; }
    .sim-btn:hover { background: var(--accent-gradient); border-color: transparent; }
    .sim-btn span { float: right; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1>🎛️ BudgetPick Admin</h1>
        <p class="admin-subtitle">System Control & Scenario Simulator</p>
      </div>
      <div id="system-status" class="status-badge yellow">Checking System...</div>
    </div>

    <div class="admin-grid">
      <!-- Left Column: Logs and Controls -->
      <div class="space-y">
        <div class="admin-card">
          <div class="admin-card-header">
            <h3>📡 Live Fetch Logs</h3>
            <button class="btn-primary btn-sm" onclick="triggerFetch()">Run Manual Fetch</button>
          </div>
          <div id="log-box" class="log-container">
            <div class="log-entry">[SYSTEM] Initializing admin panel...</div>
          </div>
        </div>

        <div class="admin-card admin-card-offset">
          <h3>📊 Active Database Stats</h3>
          <div class="emi-results admin-card-stats">
            <div class="emi-result-card"><div class="emi-num" id="total-phones">0</div><div class="emi-label">Phones Tracked</div></div>
            <div class="emi-result-card"><div class="emi-num" id="total-alerts">0</div><div class="emi-label">Active Alerts</div></div>
            <div class="emi-result-card"><div class="emi-num" id="scam-score">100%</div><div class="emi-label">Scam Accuracy</div></div>
          </div>
        </div>
      </div>

      <!-- Right Column: Scenario Simulator -->
      <div class="admin-card">
        <h3>🎭 Scenario Simulator</h3>
        <p class="admin-scenario-desc">Test edge cases without waiting for live data.</p>
        
        <button class="sim-btn" onclick="simulateScenario('price_drop')">📉 Force Price Drop <span>Run →</span></button>
        <button class="sim-btn" onclick="simulateScenario('stock_out')">❌ Simulate Out of Stock <span>Run →</span></button>
        <button class="sim-btn" onclick="simulateScenario('new_phone')">🚀 Inject Upcoming Phone <span>Run →</span></button>
        <button class="sim-btn" onclick="simulateScenario('scam_hit')">🛡️ Test Scam URL Match <span>Run →</span></button>
        <button class="sim-btn" onclick="simulateScenario('fail_fetch')">⚠️ Simulate Scraper Fail <span>Run →</span></button>
        <button class="sim-btn admin-flash-btn" onclick="simulateScenario('flash_sale')">⚡ Trigger Flash Sale <span>Run →</span></button>
        
        <hr class="admin-hr">
        
        <h4>Quick Actions</h4>
        <button class="btn-outline admin-back-btn" onclick="location.href='/'">← Back to Main Site</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    
    async function updateStatus() {
      try {
        const res = await fetch(`${API}/api/status`);
        const data = await res.json();
        
        const badge = document.getElementById('system-status');
        badge.textContent = data.status === 'fetching' ? '⚡ Active Sync' : '🟢 System Idle';
        badge.className = `status-badge ${data.status === 'fetching' ? 'yellow' : 'green'}`;
        
        const logBox = document.getElementById('log-box');
        logBox.innerHTML = data.recentLogs.map(log => `
          <div class="log-entry">
            <span style="color: #64748b">[${new Date(log.timestamp).toLocaleTimeString()}]</span> 
            <span style="color: ${log.status==='success'?'#4ade80':'#ff6b81'}">[${log.status.toUpperCase()}]</span> 
            ${log.message}
          </div>
        `).join('');
        
      } catch (e) { console.log('Admin status error', e); }
    }

    async function triggerFetch() {
      alert('Manual fetch started. Check logs in a few seconds.');
      fetch(`${API}/api/refresh`, { method: 'POST' });
      setTimeout(updateStatus, 2000);
    }

    async function simulateScenario(type) {
      try {
        const res = await fetch(`${API}/api/simulate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type })
        });
        const data = await res.json();
        if (data.success) {
          alert(`Success: ${data.message}`);
          updateStatus();
        } else {
          alert(`Error: ${data.error}`);
        }
      } catch (e) { alert('Failed to run simulation'); }
    }

    setInterval(updateStatus, 5000);
    updateStatus();
    
    // Fill dummy stats for now
    document.getElementById('total-phones').textContent = '18';
    document.getElementById('total-alerts').textContent = '45';
  </script>
</body>
</html>
